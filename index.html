<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>So nutze ich KI richtig und transparent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#fff; --pink:#c93b87; --rosa:#D76A9C; --rosa-deep:#9E3A68;
  --fill:#FCEFF5; --soft:#fdeef5; --edge:#F3CFDF; --ink:#3e3036; --ink2:#8C6A7B;
  --grey:#c9c3c8; --grey-f:#f4f0f3;
  --ok-bg:#e8f5ee; --ok-bd:#5fb38a; --ok-tx:#1d5a3a;
  --no-bg:#fdecea; --no-bd:#e5737a; --no-tx:#8a2b27;
  --teal:#3d7378; --blue:#dce9f2; --blue-tx:#1f3b4d;
  --pad:clamp(1.5rem,6vw,5rem);
  --ease:cubic-bezier(.3,.1,.2,1);
  --hand:Caveat,"Segoe Print","Bradley Hand",cursive;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--pink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default}
button{font-family:inherit}
i,em,cite,address{font-style:normal}

.logo{position:fixed;top:calc(1.25rem + env(safe-area-inset-top,0px));right:var(--pad);height:clamp(3.2rem,7vw,4.6rem);aspect-ratio:219/240;z-index:30;pointer-events:none}
.logo img{display:block;width:100%;height:100%}

/* ---------- Starten-Button (auf der Titelfolie) ---------- */
.go{position:relative;font-weight:700;font-size:1.5rem;letter-spacing:.01em;line-height:1;color:#fff;background:var(--pink);border:0;border-radius:980px;padding:.85em 2.4em;cursor:pointer;margin-top:44px;opacity:0;transition:background .35s,transform .35s}
.tl.on .go{animation:emerge 1.2s var(--ease) 2.2s both,breathe 3.2s ease-in-out 3.6s infinite}
.go:hover{background:var(--rosa-deep);transform:scale(1.04)}
.go:focus-visible{outline:3px solid var(--edge);outline-offset:5px}
@keyframes emerge{from{opacity:0;filter:blur(12px);transform:translateY(14px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(201,59,135,0)}50%{box-shadow:0 0 0 14px rgba(201,59,135,.08)}}

/* ---------- Bühne ---------- */
#stage{position:fixed;inset:0}
#fit{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:50% 50%}
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s}
.sl.on{opacity:1;visibility:visible;transition:opacity .6s ease .1s}

.rf{position:absolute}
.rf::before{content:"";position:absolute;inset:0;border:2px solid var(--pink);border-radius:18px;filter:url(#rough);pointer-events:none}

/* Kopf */
.kick{position:absolute;left:64px;top:40px;font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rosa)}
.h2{position:absolute;left:64px;top:62px;margin:0;font-weight:800;font-size:48px;line-height:1.1;letter-spacing:-.03em;color:var(--pink);max-width:1000px;white-space:nowrap}
.rule{position:absolute;left:64px;top:122px;width:420px;height:14px;overflow:visible}
.rule path{fill:none;stroke:var(--pink);stroke-width:2.4;stroke-linecap:round;filter:url(#rough);stroke-dasharray:1 2;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s ease .3s}
.sl.on .rule path{stroke-dashoffset:0}
.sl .kick,.sl .h2{opacity:0}
.sl.on .kick{animation:emerge 1s var(--ease) .15s both}
.sl.on .h2{animation:emerge 1.1s var(--ease) .25s both}
.tool{position:absolute;left:64px;top:146px;display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700;color:var(--rosa-deep)}
.tool span{border:1.5px solid var(--pink);border-radius:999px;padding:5px 16px;background:#fff}
.sl .tool{opacity:0}
.sl.on .tool{animation:emerge 1s var(--ease) .5s both}

/* Reveal */
.rv{opacity:0;transform:translateY(10px);filter:blur(6px);transition:opacity .7s ease,transform .7s ease,filter .7s ease;pointer-events:none}
.rv.show{opacity:1;transform:none;filter:none;pointer-events:auto}

/* Chat */
.chat{left:64px;top:196px;width:790px;height:464px;padding:16px 20px 0;display:flex;flex-direction:column;gap:8px;background:#fff}
.chead{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);padding-bottom:4px}
.av{flex:none;width:26px;height:26px;border-radius:50%;border:1.8px solid var(--pink);display:grid;place-items:center;background:#fff}
.av svg{width:14px;height:14px;fill:var(--pink)}
.cb{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 6px 18px 0;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--edge) transparent;mask-image:linear-gradient(#000 calc(100% - 22px),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.cb::-webkit-scrollbar{width:6px}.cb::-webkit-scrollbar-thumb{background:var(--edge);border-radius:6px}
.it{display:none;flex-direction:column;gap:4px;max-width:90%}
.it.show{display:flex;animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.it .who{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.it .b{padding:10px 16px;font-size:17px;line-height:1.42;font-weight:500}
.it.me{align-self:flex-end;align-items:flex-end}
.it.me .who{color:var(--rosa-deep)}
.it.me .b{background:var(--pink);color:#fff;border-radius:16px 16px 4px 16px;font-weight:600}
.it.ai{align-self:flex-start}
.it.ai .who{color:var(--ink2)}
.it.ai .b{background:var(--soft);border:1.5px solid var(--edge);border-radius:16px 16px 16px 4px;color:#5a2c45}
.it.ai.teach .b{background:var(--grey-f);border-color:#e6dfe4;color:var(--ink)}
.it .b ol,.it .b ul{margin:4px 0 0;padding-left:22px}
.it .b li{margin:2px 0}
.it .b i{color:var(--rosa-deep)}
.it.note{align-self:stretch;max-width:100%}
.it.note .b{border:1.8px dashed var(--pink);border-radius:14px;background:#fff;color:#6b2a4c;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.it.note svg{flex:none;width:20px;height:20px;stroke:var(--pink);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.td{display:none;gap:5px;align-items:center;height:20px}
.td b{width:7px;height:7px;border-radius:50%;background:var(--rosa);animation:tdot 1s ease-in-out infinite}
.td b:nth-child(2){animation-delay:.15s}.td b:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}
.it.typing .td{display:inline-flex}
.it.typing .txt{display:none}
.hint0{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:18px;font-weight:600;color:var(--ink2);transition:opacity .4s ease}
.hint0.gone{opacity:0}

/* Seitenspalte */
.side{position:absolute;left:886px;top:196px;width:330px;display:flex;flex-direction:column;gap:16px}
.card{border-radius:18px;padding:16px 20px;font-size:16px;line-height:1.45;font-weight:500}
.card h5{margin:0 0 6px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.card svg{width:20px;height:20px;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card.ok{background:var(--ok-bg);border:1.8px solid var(--ok-bd);color:#24402f}
.card.ok h5{color:var(--ok-tx)}.card.ok svg{stroke:#2f9e55}
.card.no{background:var(--no-bg);border:1.8px solid var(--no-bd);color:#4a2422}
.card.no h5{color:var(--no-tx)}.card.no svg{stroke:#c0444c}
.card.pk{background:var(--soft);border:1.8px solid var(--edge);color:var(--ink)}
.card.pk h5{color:var(--rosa-deep)}
.card.teal{background:var(--teal);color:#fff}
.card.teal h5{color:#fff}
.card.blue{background:var(--blue);color:var(--blue-tx)}
.card.blue h5{color:var(--blue-tx)}

/* Sprechblasen */
.prs{position:absolute;left:64px;top:156px;width:1152px;display:flex;flex-direction:column;gap:10px}
.pr{display:grid;grid-template-columns:78px 1fr 1.9fr 78px;gap:16px;align-items:start}
.avw{display:flex;flex-direction:column;align-items:center;gap:4px}
.avw small{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.avc{width:60px;height:60px;border-radius:50%;border:1.8px solid var(--pink);background:#fff;display:grid;place-items:center}
.avc svg{width:28px;height:34px;fill:var(--soft);stroke:var(--pink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.avw.t .avc{border-color:var(--grey)}.avw.t .avc svg{fill:var(--grey-f);stroke:#9a8f96}
.sp{position:relative;padding:9px 18px;font-size:15.5px;line-height:1.4;font-weight:500;border-radius:22px;border:2px solid var(--pink)}
.sp.t{background:var(--grey-f);border-color:#cfc6cc;color:var(--ink);margin-top:4px}
.sp.m{background:var(--soft);color:#5a2c45;margin-top:10px}
.sp::after{content:"";position:absolute;top:20px;width:16px;height:16px;background:inherit;transform:rotate(45deg)}
.sp.t::after{left:-10px;border-left:2px solid #cfc6cc;border-bottom:2px solid #cfc6cc}
.sp.m::after{right:-10px;border-right:2px solid var(--pink);border-top:2px solid var(--pink)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.two2 .card{font-size:15px;padding:10px 18px;line-height:1.4}
.two2 .card h5{font-size:15.5px;margin-bottom:3px}

/* Titel */
.tl{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.tl::before{content:"";position:absolute;left:50%;top:55%;width:760px;height:760px;transform:translate(-50%,-50%) scale(.6);border-radius:50%;background:radial-gradient(circle,rgba(248,222,234,.9),transparent 68%);opacity:0;transition:opacity 2.4s ease,transform 2.4s ease}
.tl.on::before{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tl h1{position:relative;margin:0;font-weight:800;font-size:84px;line-height:1.05;letter-spacing:-.03em;color:var(--pink);max-width:15ch;opacity:0}
.tl.on h1{animation:emerge 1.6s var(--ease) .5s both}

/* Überblick */
.big{position:absolute;left:64px;right:64px;top:210px;text-align:center}
.big .s1{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1.12;color:var(--pink)}
.big .s2{margin-top:18px;font-size:28px;font-weight:600;color:var(--ink2)}
.ban{position:absolute;left:64px;top:170px;width:1152px;border-radius:26px;background:var(--teal);color:#fff;padding:20px 32px;display:flex;align-items:center;gap:24px}
.ban svg{flex:none;width:44px;height:44px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ban b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em}
.ban span{font-size:18px;font-weight:500}
.lead{position:absolute;left:64px;top:290px;background:var(--blue);color:var(--blue-tx);border-radius:999px;padding:11px 26px;font-size:19px;font-weight:700}
.road{position:absolute;left:0;top:380px;width:1280px;height:300px}
.road .line{position:absolute;left:150px;right:150px;top:44px;border-top:2.5px dashed #e7a9c8}
.nd{position:absolute;top:0;width:190px;text-align:center;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.nd .c{width:88px;height:88px;margin:0 auto;border:1.8px solid var(--pink);border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .35s var(--ease),background .3s,box-shadow .3s}
.nd .c svg{width:38px;height:38px;fill:none;stroke:var(--pink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nd:hover .c,.nd:focus-visible .c{transform:scale(1.1);background:var(--soft);box-shadow:0 0 0 10px rgba(201,59,135,.07)}
.nd:focus-visible{outline:none}
.nd small{display:block;margin-top:16px;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rosa)}
.nd strong{display:block;margin-top:5px;font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.01em;color:var(--pink)}
.nd em{display:block;margin-top:6px;font-style:normal;font-size:14px;font-weight:600;color:var(--ink2)}
.road .tip{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:16px;font-weight:600;color:var(--ink2)}

/* HVZ */
.tabs{position:absolute;left:64px;top:152px;display:flex;gap:10px}
.tab{border:1.8px solid var(--pink);background:#fff;color:var(--pink);border-radius:999px;padding:8px 20px;font-size:16px;font-weight:700;cursor:pointer;transition:background .25s,color .25s}
.tab:hover{background:var(--soft)}
.tab.act{background:var(--pink);color:#fff}
.pane{position:absolute;left:64px;top:206px;width:1152px;display:none}
.pane.act{display:block;animation:pop .4s var(--ease) both}
.hvz{border:2px solid var(--pink);border-radius:18px;overflow:hidden;background:#fff}
.hvz .r{display:grid;grid-template-columns:1.15fr 1.1fr 1.05fr 1.15fr 1fr}
.hvz .r>div{padding:12px 16px;font-size:16px;line-height:1.4;font-weight:500;color:var(--ink)}
.hvz .h{background:var(--soft);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hvz .h>div{font-size:12.5px;color:var(--rosa-deep);padding:11px 16px}
.hvz .r+.r{border-top:1.5px solid var(--edge)}
.hvz .hr{display:none}
.hvz .hr.show{display:grid;animation:pop .5s var(--ease) both}
.hvz .hr:hover{background:#fff8fb}
.pane .two{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pane .two .card{display:none}
.pane .two .card.show{display:block;animation:pop .5s var(--ease) both}
.pane .two .card{font-size:17px}
.pane .two .card h5{font-size:18px}
.anh{border:2px solid var(--edge);background:#fffafc;border-radius:18px;padding:18px 26px;font-size:16px;line-height:1.5;color:var(--ink);font-weight:500}
.anh .t{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--rosa-deep);margin:0 0 6px}
.anh .t:not(:first-child){margin-top:14px}
.anh p{margin:2px 0}
.anh b{color:var(--rosa-deep);font-weight:800}
.anh i{color:var(--ink2)}

/* Ende */
.chk{position:absolute;left:64px;top:170px;width:1152px;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.ci{display:flex;align-items:flex-start;gap:16px;text-align:left;border:1.8px solid var(--edge);background:#fff;border-radius:18px;padding:11px 18px;cursor:pointer;color:var(--ink);transition:background .3s,border-color .3s;font-size:18px;font-weight:600;line-height:1.35}
.ci:hover{background:var(--soft)}
.ci .bx{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--pink);display:grid;place-items:center;background:#fff;margin-top:1px;transition:background .25s}
.ci .bx svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:opacity .2s,transform .25s}
.ci.done{background:var(--soft);border-color:var(--pink)}
.ci.done .bx{background:var(--pink)}
.ci.done .bx svg{opacity:1;transform:none}
.ci small{display:block;font-size:14px;font-weight:500;color:var(--ink2);margin-top:3px}
.ci.last{grid-column:1/-1}
.cc{position:absolute;left:64px;top:152px;font-size:17px;font-weight:600;color:var(--ink2)}
.cc b{color:var(--pink)}
.warn{position:absolute;left:64px;top:512px;width:1152px;background:var(--no-bg);border:1.8px solid var(--no-bd);border-radius:22px;padding:14px 24px;display:flex;gap:20px;align-items:flex-start}
.warn svg{flex:none;width:40px;height:40px;fill:none;stroke:#c0444c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.warn b{display:block;font-size:17.5px;line-height:1.4;font-weight:700;color:#6e1f1b;margin-bottom:5px}
.warn span{font-size:14px;line-height:1.5;color:#4a2422;font-weight:500}

.back{position:absolute;right:64px;top:138px;border:0;background:var(--pink);color:#fff;border-radius:999px;padding:11px 26px;font-size:17px;font-weight:700;cursor:pointer;transition:background .3s,transform .3s;z-index:5}
.back:hover{background:var(--rosa-deep);transform:scale(1.04)}
.back:focus-visible{outline:3px solid var(--edge);outline-offset:4px}

/* Fortschritt & Bedienung */
#dots{position:fixed;bottom:calc(.7rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:15;opacity:0;pointer-events:none;transition:opacity .8s}
#dots.on{opacity:1;pointer-events:auto}
#dots i{position:relative;width:7px;height:7px;margin:8px;border-radius:50%;background:var(--edge);cursor:pointer;transition:background .3s,transform .3s}
#dots i::after{content:"";position:absolute;inset:-9px}
#dots i:hover{background:var(--rosa);transform:scale(1.5)}
#dots i.a{background:var(--pink);transform:scale(1.3)}
#hint{position:fixed;left:calc(1rem + env(safe-area-inset-left,0px));bottom:calc(.9rem + env(safe-area-inset-bottom,0px));font-size:13px;font-weight:600;color:var(--ink2);z-index:15;opacity:0;transition:opacity .8s;pointer-events:none}
#hint.on{opacity:.9}
#bk,#fw{position:fixed;bottom:calc(.8rem + env(safe-area-inset-bottom,0px));z-index:16;font-size:14px;font-weight:700;color:var(--pink);background:#fff;border:1.5px solid var(--pink);border-radius:999px;padding:7px 18px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s,background .25s,color .25s}
#fw{right:calc(1rem + env(safe-area-inset-right,0px));background:var(--pink);color:#fff}
#bk{right:calc(6.2rem + env(safe-area-inset-right,0px))}
#bk.on,#fw.on{opacity:1;pointer-events:auto}
#bk:hover{background:var(--soft)}#fw:hover{background:var(--rosa-deep)}
#bk:focus,#fw:focus{outline:none}#bk:focus-visible,#fw:focus-visible{outline:3px solid var(--edge);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

const NODES = [

/* ---------- Folien bauen ---------- */
const slides = [];
function add(html, max, cls = ''){ slides.push({html, max, cls}); }

/* 0 Titel */
add(`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px">

/* 1 Überblick */
add(`${head('Überblick','Gute Praxis in sechs Schritten')}
  <div class="ban rv" data-s="1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/></svg><div><b>Die Nutzung KI-basierter Tools ist freiwillig.</b><span>Dir entstehen keine Nachteile, wenn du darauf verzichtest.</span></div></div>

/* 2–5 Schritte mit Dialog */
STEPS.forEach(st => {
  let s = 0;
  const items = st.items.map(it => {
    s++;
    if (it.t === 'note') return `<div class="it note" data-s="${s}"><div class="b">${it.ic}<div><b>${it.l}:</b> ${it.h}</div></div></div>`;
    return `<div class="it ${it.t}${it.teach?' teach':''}" data-s="${s}"><div class="who">${it.l}</div><div class="b"><i class="td"><b></b><b></b><b></b></i><span class="txt">${it.h}</span></div></div>`;
  }).join('');
  const sOk = ++s, sNo = ++s;

});

/* 6 Dokumentieren */
add(`${head('Schritt 5 von 6','Dokumentieren und offenlegen')}
  <div class="tabs" style="top:146px;left:64px" data-noadv>
    <button class="tab act" data-tab="0" type="button">Hilfsmittelverzeichnis (HVZ)</button>
    <button class="tab" data-tab="1" type="button">Anhang: Chatverlauf</button>
  </div>
  <div class="pane act" data-pane="0" style="top:206px">
    <div class="hvz">
      <div class="r h"><div>Hersteller / Anbieter</div><div>Modell / Version, Datum</div><div>Verwendungszweck</div><div>Stelle in der Arbeit</div><div>Verwendete Prompts</div></div>
      <div class="r hr" data-s="1"><div>Cornelsen Verlag, Duden-Schreibassistent</div><div>kostenlose Version (Gastzugang), 07.07.2026</div><div>Sprachliche Korrektur: Zeichensetzung und Grammatik</div><div>gesamte Arbeit</div><div>Prompt 1 im Wortlaut</div></div>
      <div class="r hr" data-s="2"><div>OpenAI, ChatGPT</div><div>GPT-5.5, 08.07.2026</div><div>Themenfindung, Suchbegriffe, Arbeitsplan</div><div>Beginn der Arbeit, 1. Kapitel: Begründung der Themenwahl</div><div>Prompt 1 bis 4 im Wortlaut</div></div>
    </div>
    <div style="margin-top:10px;font-size:15px;font-weight:600;color:var(--ink2)">Alphabetisch nach Herstellername geordnet.</div>
    <div class="two">
      <div class="card teal" data-s="3"><h5>Besonderheit: schriftliche Ausarbeitung 5. PK und BLL</h5>Zusätzlich zum HVZ kommen die Prompt-Ergebnisse in den Anhang. Der gesamte Chatverlauf muss dokumentiert werden.</div>
      <div class="card blue" data-s="4"><h5>Eigenständigkeitserklärung</h5>„Ich versichere, dass ich alle genutzten KI-Hilfsmittel im Hilfsmittelverzeichnis vollständig offengelegt habe.“</div>
    </div>
  </div>
  <div class="pane" data-pane="1" style="top:206px">
    <div class="anh">

      <p><b>Antwort:</b> „Hier sind fünf mögliche Fragestellungen: 1. Wie verändert der Klimawandel die Hitzebelastung in Berliner Stadtteilen? …“ <i>(vollständig, ungekürzt)</i></p>
      <p><b>Prompt 2:</b> „Welche der vorgeschlagenen Fragestellungen eignet sich besonders …“</p>
      <p><b>Antwort:</b> „Am besten eignet sich Frage 1. …“ <i>(vollständig, ungekürzt)</i></p>
      <p><b>Prompt 3 und Prompt 4:</b> jeweils mit vollständiger Antwort</p>
      <div class="t">Anhang B · Chatverlauf Cornelsen Duden-Schreibassistent, 07.07.2026</div>
      <p><b>Prompt 1:</b> „Überprüfe meine Arbeit auf Rechtschreibung, Zeichensetzung und Grammatik“</p>
      <p><b>Antwort:</b> <i>vollständig, ungekürzt</i></p>
    </div>
  </div>`, 4);

/* 7 Prüfen und reflektieren (Sprechblasen) */
(() => {
  const FIG = '<svg viewBox="0 0 40 48"><circle cx="20" cy="14" r="9"/><path d="M5 44c1.5-10 8-15 15-15s13.5 5 15 15"/></svg>';
  let rows = '', s = 0;
  for (let r = 0; r < 3; r++) {
    const t = EXAM.items[2*r], m = EXAM.items[2*r+1], s1 = ++s, s2 = ++s;
    rows += `<div class="pr">
      <div class="avw t rv" data-s="${s1}"><div class="avc">${FIG}</div><small>Lehrkraft</small></div>
      <div class="sp t rv" data-s="${s1}">${t.h}</div>
      <div class="sp m rv" data-s="${s2}">${m.h}</div>

    </div>`;
  }
  const c1 = ++s, c2 = ++s;
  add(`${head('Schritt 6 von 6', EXAM.title)}
    <div class="prs">${rows}
      <div class="two2">
        <div class="card pk rv" data-s="${c1}"><h5>${EXAM.cards[0].t}</h5>${EXAM.cards[0].h}</div>
        <div class="card pk rv" data-s="${c2}"><h5>${EXAM.cards[1].t}</h5>${EXAM.cards[1].h}</div>
      </div>
    </div>`, c2);
})();

/* 8 Abschluss */
add(`${head('Zum Schluss','Checkliste vor der Abgabe')}
  <button class="back rv show" data-noadv data-go="1" type="button">Zur Abschnittsübersicht</button>
  <div class="cc rv show" style="top:148px;"><b id="ccn">0</b> von 6 erledigt · zum Abhaken anklicken</div>
  <div class="chk" style="top:190px" data-noadv>
    ${CHECKS.map((c,i)=>`<button class="ci rv" data-s="${i<5?1:1}" data-ck type="button"><span class="bx">${CHECK}</span><span>${c[0]}<small>${c[1]}</small></span></button>`).join('')}
  </div>
  <div class="warn rv" data-s="2" style="top:512px"><svg viewBox="0 0 24 24"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v5M12 17.5v.01"/></svg><div><b>Eine nicht den Vorgaben entsprechende KI-Nutzung oder eine Verletzung der Dokumentationspflicht gilt als Täuschungsversuch gemäß § 37 VO-GO Berlin und kann je nach Umfang und Schwere mit 0 Punkten (Note 6) bewertet werden.</b><span>Bei Korrektur und Bewertung werden Tools zur Erkennung von KI-generierten Inhalten und Plagiaten eingesetzt. Beispiel und Dialoge sind fiktiv und gekürzt dargestellt. Grundlage sind die KI-Vorgaben für außerunterrichtlich erstellte Arbeiten am RLG.</span></div></div>`, 2);

/* ---------- DOM aufbauen ---------- */
slides.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'sl ' + s.cls; d.dataset.i = i; d.innerHTML = s.html;
  fitEl.appendChild(d); s.el = d;
});
const dotsEl = $('#dots');
dotsEl.innerHTML = slides.map(() => '<i></i>').join('');
const dots = [...dotsEl.children];

/* ---------- Zustand ---------- */
let cur = 0, stage = 0, showAll = false, started = false, tok = 0, auto = true, timer = null;
function clearT(){ clearTimeout(timer); timer = null; }
function delayFor(){
  const els = [...slides[cur].el.querySelectorAll('[data-s="' + stage + '"]')];
  if (!els.length) return 1500;
  const len = Math.max(...els.map(e => e.textContent.length));
  const e0 = els[0]; let ms;
  if (e0.classList.contains('ai')) ms = 900 + len * 17;
  else if (e0.classList.contains('me')) ms = 800 + len * 14;
  else ms = 1000 + len * 18;
  return Math.max(1500, Math.min(7000, ms));
}
function schedule(){
  clearT();
  if (!auto || showAll || !started || document.hidden) return;
  if (stage >= slides[cur].max) return;
  timer = setTimeout(() => { show(cur, stage + 1, true); }, delayFor());
}
document.addEventListener('visibilitychange', schedule);

function apply(animate){
  const s = slides[cur];
  s.el.querySelectorAll('[data-s]').forEach(el => {
    const on = showAll || +el.dataset.s <= stage;
    const was = el.classList.contains('show');
    el.classList.toggle('show', on);
    if (on && !was && animate && el.classList.contains('ai')) {
      el.classList.add('typing'); const my = ++tok;
      setTimeout(() => { if (my === tok || true) el.classList.remove('typing'); scrollChat(); }, 850);
    } else if (!on || !animate) el.classList.remove('typing');
  });
  const h0 = s.el.querySelector('.hint0'); if (h0) h0.classList.toggle('gone', showAll || stage > 0);
  scrollChat();
}
function scrollChat(){
  const cb = slides[cur].el.querySelector('.cb'); if (!cb) return;
  requestAnimationFrame(() => { cb.scrollTop = cb.scrollHeight; });
}
function show(i, st, animate){
  cur = Math.max(0, Math.min(slides.length - 1, i)); stage = st;
  slides.forEach((s, k) => s.el.classList.toggle('on', k === cur));
  dots.forEach((d, k) => d.classList.toggle('a', k === cur));
  apply(animate);
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  schedule();
}
function next(){
  if (!started) return;
  const s = slides[cur];
  if (!showAll && stage < s.max) { show(cur, stage + 1, true); }
  else if (cur < slides.length - 1) { show(cur + 1, 0, false); if (showAll) apply(false); }
  $('#hint').classList.remove('on');
}
function prev(){
  if (!started) return;
  if (!showAll && stage > 0) show(cur, stage - 1, false);
  else if (cur > 0) show(cur - 1, showAll ? 0 : slides[cur - 1].max, false);
  clearT();
}
function go(i){ show(i, 0, false); }

/* ---------- Bedienung ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-noadv],#dots,#bk,#fw')) return;
  next();
});
document.addEventListener('keydown', e => {
  if (!started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); begin(); } return; }
  if (cur === 0 && !started) return;
  if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  if (['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(slides.length - 1);
});
dots.forEach((d, i) => d.addEventListener('click', e => { e.stopPropagation(); go(i); }));
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); }
}, {passive:true});

fitEl.addEventListener('click', e => {
  const nd = e.target.closest('[data-go]'); if (nd) { e.stopPropagation(); go(+nd.dataset.go); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { e.stopPropagation(); const sl = tab.closest('.sl');
    sl.querySelectorAll('.tab').forEach(t => t.classList.toggle('act', t === tab));
    sl.querySelectorAll('.pane').forEach(p => p.classList.toggle('act', p.dataset.pane === tab.dataset.tab)); return; }
  const ck = e.target.closest('[data-ck]');
  if (ck) { e.stopPropagation(); ck.classList.toggle('done'); const n = fitEl.querySelectorAll('.ci.done').length; $('#ccn').textContent = n; }
});

$('#bk').addEventListener('click', e => { e.stopPropagation(); prev(); e.currentTarget.blur(); });
$('#fw').addEventListener('click', e => { e.stopPropagation(); next(); e.currentTarget.blur(); });

function ui(){ dotsEl.classList.add('on'); $('#bk').classList.add('on'); $('#fw').classList.add('on'); $('#hint').classList.add('on'); }
function begin(){
  if (started) return; started = true; $('#go').blur();
  setTimeout(ui, 600);
  show(1, 0, false);
}
$('#go').addEventListener('click', e => { e.stopPropagation(); begin(); });
$('#go').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.stopPropagation(); } });
const h0 = parseInt((location.hash || '').slice(1), 10);
if (h0 > 1 && h0 <= slides.length) { started = true; ui(); show(h0 - 1, 0, false); }
else show(0, 0, false);
})();
</script>
